<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>4 Lane Rhythm Game - iPhone Complete</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:manipulation}
button,input{font:inherit}button{min-height:42px;border:0;border-radius:11px;padding:9px 12px;background:#287cff;color:#fff;font-weight:800}button.secondary{background:#353842}button.danger{background:#d43d3d}button:disabled{opacity:.45}
.screen{display:none;width:100%;height:100%}.screen.active{display:flex}
#home,#result{align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center}
h1{font-size:28px;margin:0}h2{margin:0}.big{width:min(90vw,360px);font-size:18px;padding:15px}.small{font-size:12px;color:#aaa;line-height:1.5}

/* GAME */
#game{flex-direction:column;background:linear-gradient(#18204b,#080a11)}
.gameTop{min-height:64px;display:flex;align-items:center;justify-content:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 7px 6px;z-index:20;flex-wrap:wrap;background:rgba(10,12,20,.94)}
.gameTop button{font-size:12px;padding:8px 9px;min-height:38px}.stat{font-size:12px;white-space:nowrap;padding:0 2px}
#gameArea{position:relative;flex:1;overflow:hidden;min-height:0}
#gameLanes{position:absolute;inset:0;width:min(100vw,520px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #444;border-right:1px solid #444}
.gameLane{position:relative;border-right:1px solid #343844;background:rgba(255,255,255,.025)}.gameLane:last-child{border-right:0}.gameLane:active{background:rgba(255,255,255,.12)}
.hitline{position:absolute;left:0;right:0;top:85%;height:5px;background:#fff;box-shadow:0 0 12px #fff;z-index:3}.laneKey{position:absolute;left:0;right:0;top:88%;text-align:center;color:#bbb;font-size:12px;z-index:5}
.gameNote{position:absolute;width:72%;height:32px;left:14%;border-radius:9px;background:#35a9ff;border:2px solid #bfe8ff;box-shadow:0 0 14px rgba(53,169,255,.9);z-index:4;pointer-events:none}
#judge{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:30px;font-weight:900;opacity:0;z-index:30;text-shadow:0 2px 8px #000}#judge.show{animation:j .36s ease-out}@keyframes j{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.1)}}
#pauseOverlay{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}#pauseOverlay.show{display:flex}#pauseOverlay .label{font-size:30px;font-weight:900}

/* EDITOR */
#editor{flex-direction:column;background:#101010}
.editorTop{padding:calc(6px + env(safe-area-inset-top)) 7px 6px;background:#191919;z-index:20;display:flex;flex-wrap:wrap;gap:5px;align-items:center}.editorTop h2{font-size:17px;margin-right:3px}.editorTop button{padding:7px 9px;font-size:11px;min-height:36px}#audioInput{max-width:100%;font-size:11px}#editorInfo{width:100%;font-size:11px;color:#bbb;line-height:1.35}
#editorArea{position:relative;flex:1;overflow:hidden;min-height:0}
#editorLanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid #444;border-right:1px solid #444;width:min(100vw,520px);margin:auto;padding-bottom:158px}
.editorLane{position:relative;border-right:2px solid #4a4f5c;overflow:visible;background:rgba(255,255,255,.025)}.editorLane:last-child{border-right:0}.editorLane:active{background:rgba(255,255,255,.10)}
.grid{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.07) 0,rgba(255,255,255,.07) 1px,transparent 1px,transparent 46px);pointer-events:none}
.editorLaneLabel{position:absolute;top:6px;left:0;right:0;text-align:center;color:#ddd;font-weight:900;font-size:14px;pointer-events:none;text-shadow:0 2px 4px #000}
.editorNote{position:absolute;width:86%;left:7%;height:42px;border:3px solid #fff;border-radius:11px;box-shadow:0 3px 12px rgba(0,0,0,.65),0 0 12px rgba(255,255,255,.35);z-index:10;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900;user-select:none;touch-action:none;text-shadow:0 1px 3px #000}.editorLane[data-lane="0"] .editorNote{background:#e74c3c}.editorLane[data-lane="1"] .editorNote{background:#f39c12}.editorLane[data-lane="2"] .editorNote{background:#2e9f67}.editorLane[data-lane="3"] .editorNote{background:#3f7fe5}.editorNote.selected{outline:4px solid #fff;outline-offset:2px;filter:brightness(1.35);box-shadow:0 0 24px #fff;z-index:15}.editorLane.keyFlash{background:rgba(255,255,255,.22)}
#playhead{position:absolute;left:0;right:0;top:0;height:3px;background:#45b7ff;box-shadow:0 0 10px #45b7ff;z-index:25;pointer-events:none}
#fineControls{position:absolute;left:7px;right:7px;bottom:91px;min-height:61px;background:rgba(25,25,25,.96);border-radius:12px;z-index:31;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px;flex-wrap:wrap}#fineControls button{padding:7px 8px;font-size:11px;min-height:36px}#fineTime{min-width:92px;text-align:center;font-size:11px;font-weight:800}
#timeline{position:absolute;left:7px;right:7px;bottom:7px;height:112px;border-radius:12px;background:rgba(25,25,25,.97);z-index:30;padding:7px 10px}#timelineText{text-align:center;font-size:12px;margin-bottom:5px}#seekSlider{width:100%;height:32px;accent-color:#39a7ff;touch-action:pan-x}#seekButtons{display:flex;justify-content:center;gap:5px;margin-top:1px}#seekButtons button{min-height:32px;padding:5px 10px;font-size:11px}#selectedInfo{font-size:10px;color:#ccc;text-align:center;margin-top:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<section id="home" class="screen active">
<h1>🎵 4 Lane Rhythm Game</h1>
<p>iPhone対応・完全版</p>
<button class="big" id="editorBtn">🎼 譜面を作る</button>
<button class="big secondary" id="gameBtn">▶ ゲームを遊ぶ</button>
<div class="small">音楽を選択 → 再生中にレーンをタップ → 微調整 → そのままプレイ</div>
</section>

<section id="editor" class="screen" tabindex="0">
<div class="editorTop">
<h2>🎼 譜面エディター</h2>
<button class="secondary" id="editorBack">← タイトル</button>
<input id="audioInput" type="file" accept="audio/*">
<button id="audioPlay">▶ 再生</button>
<button class="secondary" id="audioStop">■ 停止</button>
<button class="secondary" id="undoBtn">↩ Undo</button>
<button class="secondary" id="redoBtn">↪ Redo</button>
<button id="saveBtn">💾 保存</button>
<button class="secondary" id="loadBtn">📂 読込</button>
<input id="chartInput" class="hidden" type="file" accept=".json,application/json">
<button class="danger" id="clearBtn">🗑 全消去</button>
<div id="editorInfo">再生中に①〜④をタップ、またはキーボードの <b>D / F / J / K</b> でノーツ配置（日本語入力中でもOK）。画面は現在位置付近の10秒間を拡大表示します。</div>
</div>
<div id="editorArea">
<div id="editorLanes">
<div class="editorLane" data-lane="0"><div class="grid"></div><div class="editorLaneLabel">① D</div></div>
<div class="editorLane" data-lane="1"><div class="grid"></div><div class="editorLaneLabel">② F</div></div>
<div class="editorLane" data-lane="2"><div class="grid"></div><div class="editorLaneLabel">③ J</div></div>
<div class="editorLane" data-lane="3"><div class="grid"></div><div class="editorLaneLabel">④ K</div></div>
</div>
<div id="playhead"></div>
<div id="fineControls">
<button class="secondary" id="minus100">−0.10s</button><button class="secondary" id="minus10">−0.01s</button>
<div id="fineTime">ノーツ未選択</div>
<button class="secondary" id="plus10">＋0.01s</button><button class="secondary" id="plus100">＋0.10s</button>
<button class="danger" id="deleteSelected">選択ノーツ削除</button>
</div>
<div id="timeline"><div id="timelineText">0.00 / 0.00 秒</div><input id="seekSlider" type="range" min="0" max="30" step="0.01" value="0" aria-label="音楽の再生位置"><div id="seekButtons"><button class="secondary" id="seekBack5">−5秒</button><button class="secondary" id="seekBack1">−1秒</button><button class="secondary" id="seekForward1">＋1秒</button><button class="secondary" id="seekForward5">＋5秒</button></div><div id="selectedInfo">スライダーを動かして再生位置を選択</div></div>
</div>
<audio id="editorAudio" preload="auto"></audio>
</section>

<section id="game" class="screen">
<div class="gameTop">
<button class="secondary" id="pauseBtn">⏸ 一時停止</button>
<button class="secondary" id="titleBtn">🏠 タイトル</button>
<div class="stat">SCORE <b id="score">0</b></div><div class="stat">COMBO <b id="combo">0</b></div><div class="stat"><span id="gameTime">0.00</span>s</div>
</div>
<div id="gameArea">
<div id="gameLanes">
<div class="gameLane" data-lane="0"><div class="laneKey">①</div></div><div class="gameLane" data-lane="1"><div class="laneKey">②</div></div><div class="gameLane" data-lane="2"><div class="laneKey">③</div></div><div class="gameLane" data-lane="3"><div class="laneKey">④</div></div><div class="hitline"></div>
</div>
<div id="judge"></div>
<div id="pauseOverlay"><div class="label">PAUSE</div><button class="big" id="resumeBtn">▶ 再開</button><button class="big secondary" id="pauseTitleBtn">🏠 タイトルへ戻る</button></div>
</div>
<audio id="gameAudio" preload="auto"></audio>
</section>

<section id="result" class="screen"><h2>RESULT</h2><div id="resultScore">SCORE 0</div><div id="resultDetail"></div><button class="big" id="retry">もう一度</button><button class="big secondary" id="resultHome">タイトルへ</button></section>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), screens=["home","editor","game","result"];
function show(id){screens.forEach(x=>$(x).classList.toggle("active",x===id));}
let chart=[{t:1,l:0},{t:1.5,l:1},{t:2,l:2},{t:2.5,l:3},{t:3,l:0},{t:3.5,l:2},{t:4,l:1},{t:4.5,l:3}];
let selected=-1,audioURL=null,editorRAF=0,gameRAF=0,editorPlaying=false;
const ea=$("editorAudio"),ga=$("gameAudio");
let undoStack=[],redoStack=[];
function cloneChart(){return chart.map(n=>({t:n.t,l:n.l}));}
function snapshot(){undoStack.push(cloneChart());if(undoStack.length>80)undoStack.shift();redoStack=[];updateHistoryButtons();}
function updateHistoryButtons(){$("undoBtn").disabled=!undoStack.length;$("redoBtn").disabled=!redoStack.length;}
function clean(){chart=chart.filter(n=>Number.isFinite(+n.t)&&Number.isFinite(+n.l)&&+n.l>=0&&+n.l<4).map(n=>({t:Math.max(0,+n.t),l:+n.l})).sort((a,b)=>a.t-b.t);if(selected>=chart.length)selected=-1;}
function dur(){return Number.isFinite(ea.duration)&&ea.duration>0?ea.duration:Math.max(30,...chart.map(n=>n.t+2));}

$("editorBtn").onclick=()=>{show("editor");renderEditor();setTimeout(()=>$("editor").focus({preventScroll:true}),0);};$("gameBtn").onclick=startGame;$("editorBack").onclick=()=>{stopEditor();show("home");};$("resultHome").onclick=()=>show("home");$("retry").onclick=startGame;
$("audioInput").onchange=e=>{const f=e.target.files[0];if(!f)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);ea.src=audioURL;ea.load();ea.onloadedmetadata=renderEditor;};
$("audioPlay").onclick=async()=>{if(!ea.src){alert("先に音楽ファイルを選んでください。");return;}try{await ea.play();editorPlaying=true;editorLoop();}catch(e){alert("再生できませんでした。もう一度『再生』を押してください。");}};
$("audioStop").onclick=stopEditor;ea.addEventListener("ended",()=>{editorPlaying=false;renderEditor();});
function stopEditor(){ea.pause();editorPlaying=false;cancelAnimationFrame(editorRAF);renderEditor();}
function editorLoop(){if(!editorPlaying)return;renderEditor();editorRAF=requestAnimationFrame(editorLoop);}
function editorUsableHeight(){return Math.max(100,$("editorArea").clientHeight-160);}
function editorWindow(){const d=dur(),cur=Math.max(0,Math.min(d,ea.currentTime||0)),span=Math.min(10,d);let start=Math.max(0,cur-2);if(start+span>d)start=Math.max(0,d-span);return{start,end:Math.min(d,start+span),span:Math.max(.001,Math.min(d,start+span)-start)};}
function renderEditor(){clean();const d=dur(),cur=ea.currentTime||0,usable=editorUsableHeight(),w=editorWindow();$("timelineText").textContent=`${cur.toFixed(2)} / ${d.toFixed(2)} 秒　｜　表示 ${w.start.toFixed(1)}〜${w.end.toFixed(1)}秒`;const seek=$("seekSlider");seek.max=d;seek.value=Math.max(0,Math.min(d,cur));$("playhead").style.top=Math.max(30,Math.min(usable,(cur-w.start)/w.span*usable))+"px";document.querySelectorAll(".editorNote").forEach(n=>n.remove());chart.forEach((n,i)=>{if(n.t<w.start||n.t>w.end)return;const el=document.createElement("div");el.className="editorNote"+(i===selected?" selected":"");el.textContent=n.t.toFixed(2)+"s";el.style.top=Math.max(32,Math.min(usable-44,(n.t-w.start)/w.span*usable))+"px";el.addEventListener("pointerdown",ev=>{ev.stopPropagation();selected=i;renderEditor();});document.querySelector(`.editorLane[data-lane="${n.l}"]`).appendChild(el);});$("fineTime").textContent=selected>=0&&chart[selected]?`選択 ${chart[selected].t.toFixed(2)}s`:"ノーツ未選択";$("selectedInfo").textContent=selected>=0&&chart[selected]?`レーン ${chart[selected].l+1} / ${chart[selected].t.toFixed(2)}秒 / 全${chart.length}ノーツ`:`全${chart.length}ノーツ・D/F/J/Kでも配置`;updateHistoryButtons();}
function placeEditorNote(lane,t){t=Math.max(0,Math.min(dur(),Number(t)||0));snapshot();chart.push({t,l:lane});clean();selected=chart.findIndex(n=>n.l===lane&&Math.abs(n.t-t)<.0001);renderEditor();const laneEl=document.querySelector(`.editorLane[data-lane="${lane}"]`);laneEl.classList.add("keyFlash");setTimeout(()=>laneEl.classList.remove("keyFlash"),90);}
document.querySelectorAll(".editorLane").forEach(l=>l.addEventListener("pointerdown",ev=>{if(ev.target.classList.contains("editorNote"))return;const lane=+l.dataset.lane;let t;if(editorPlaying&&ea.src)t=ea.currentTime;else{const r=$("editorArea").getBoundingClientRect(),usable=editorUsableHeight(),w=editorWindow();t=w.start+Math.max(0,Math.min(1,(ev.clientY-r.top)/usable))*w.span;}placeEditorNote(lane,t);}));
function handleEditorKey(ev){
  if(!$("editor").classList.contains("active") || ev.repeat) return;
  const active=document.activeElement;
  const tag=(active&&active.tagName||"").toLowerCase();
  const type=(active&&active.type||"").toLowerCase();
  if(tag==="textarea" || (tag==="input" && ["text","search","email","number","password","url","tel"].includes(type))) return;
  const codeMap={KeyD:0,KeyF:1,KeyJ:2,KeyK:3};
  const keyMap={d:0,f:1,j:2,k:3};
  let lane=codeMap[ev.code];
  if(lane===undefined) lane=keyMap[String(ev.key||"").toLowerCase()];
  if(lane===undefined) return;
  ev.preventDefault();
  ev.stopPropagation();
  if(active && active!==$("editor") && typeof active.blur==="function") active.blur();
  placeEditorNote(lane,ea.currentTime||0);
  $("editor").focus({preventScroll:true});
}
// capture=true で Safari が他要素にフォーカスしていても先に拾う
document.addEventListener("keydown",handleEditorKey,true);
$("editor").addEventListener("pointerdown",()=>{setTimeout(()=>$("editor").focus({preventScroll:true}),0);});
function nudge(dt){if(selected<0||!chart[selected]){alert("先に調整したいノーツをタップしてください。");return;}snapshot();const target=chart[selected];const lane=target.l,newT=Math.max(0,target.t+dt);target.t=newT;clean();selected=chart.findIndex(n=>n.l===lane&&Math.abs(n.t-newT)<.00001);renderEditor();}
$("minus100").onclick=()=>nudge(-.1);$("minus10").onclick=()=>nudge(-.01);$("plus10").onclick=()=>nudge(.01);$("plus100").onclick=()=>nudge(.1);
$("deleteSelected").onclick=()=>{if(selected<0||!chart[selected]){alert("削除するノーツを選択してください。");return;}snapshot();chart.splice(selected,1);selected=-1;renderEditor();};
$("clearBtn").onclick=()=>{if(!chart.length){alert("すでにノーツは0個です。");return;}if(confirm(`全${chart.length}個のノーツを削除します。よろしいですか？`)){snapshot();chart=[];selected=-1;renderEditor();}};
$("undoBtn").onclick=()=>{if(!undoStack.length)return;redoStack.push(cloneChart());chart=undoStack.pop();selected=-1;renderEditor();};$("redoBtn").onclick=()=>{if(!redoStack.length)return;undoStack.push(cloneChart());chart=redoStack.pop();selected=-1;renderEditor();};
function seekTo(t){if(!ea.src)return;ea.currentTime=Math.max(0,Math.min(dur(),Number(t)||0));renderEditor();}
$("seekSlider").addEventListener("input",e=>seekTo(e.target.value));
$("seekSlider").addEventListener("change",e=>seekTo(e.target.value));
$("seekBack5").onclick=()=>seekTo((ea.currentTime||0)-5);
$("seekBack1").onclick=()=>seekTo((ea.currentTime||0)-1);
$("seekForward1").onclick=()=>seekTo((ea.currentTime||0)+1);
$("seekForward5").onclick=()=>seekTo((ea.currentTime||0)+5);
$("saveBtn").onclick=()=>{clean();const data={version:5,audioFileName:$("audioInput").files[0]?.name||"",notes:chart};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="rhythm_chart.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$("loadBtn").onclick=()=>$("chartInput").click();$("chartInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),next=Array.isArray(x)?x:(x.notes||[]);snapshot();chart=next;selected=-1;clean();renderEditor();}catch(err){alert("譜面ファイルを読み込めませんでした。");}};r.readAsText(f);};

let audioCtx=null;function beep(freq,d=.07,type="sine",gain=.045){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
let gameRunning=false,gamePaused=false,gameNotes=[],score=0,combo=0,counts={},silentStart=0,silentPausedAt=0;
function startGame(){clean();if(!chart.length){alert("譜面にノーツがありません。先に譜面を作ってください。");return;}stopEditor();show("game");score=0;combo=0;counts={PERFECT:0,GREAT:0,GOOD:0,BAD:0,MISS:0};$("score").textContent=0;$("combo").textContent=0;gameNotes=chart.map((n,i)=>({t:n.t,l:n.l,id:i,hit:false,miss:false}));gameRunning=true;gamePaused=false;$("pauseOverlay").classList.remove("show");$("pauseBtn").textContent="⏸ 一時停止";cancelAnimationFrame(gameRAF);if(audioURL){ga.src=audioURL;ga.currentTime=0;}else{ga.removeAttribute("src");silentStart=performance.now()/1000;}beep(500,.03);if(ga.src)ga.play().catch(()=>{});gameRAF=requestAnimationFrame(gameLoop);}
function gameNow(){if(ga.src)return ga.currentTime||0;return gamePaused?silentPausedAt:(performance.now()/1000-silentStart);}
function gameLoop(){if(!gameRunning||gamePaused)return;const now=gameNow(),h=$("gameArea").clientHeight,hitY=h*.85,travel=1.8;$("gameTime").textContent=now.toFixed(2);document.querySelectorAll(".gameNote").forEach(x=>x.remove());gameNotes.forEach(n=>{if(n.hit||n.miss)return;if(now>n.t+.25){n.miss=true;counts.MISS++;combo=0;judge("MISS");return;}const left=n.t-now;if(left<=travel&&left>=-.25){const p=1-left/travel,el=document.createElement("div");el.className="gameNote";el.style.top=(-34+(hitY+34)*p)+"px";document.querySelector(`.gameLane[data-lane="${n.l}"]`).appendChild(el);}});$("score").textContent=score;$("combo").textContent=combo;if(ga.src&&ga.ended){finishGame();return;}if(!ga.src&&now>Math.max(...gameNotes.map(n=>n.t))+1){finishGame();return;}gameRAF=requestAnimationFrame(gameLoop);}
function judge(x){const j=$("judge");j.textContent=x;j.classList.remove("show");void j.offsetWidth;j.classList.add("show");}
function tapLane(lane){if(!gameRunning||gamePaused)return;const now=gameNow();let target=null,best=Infinity;gameNotes.forEach(n=>{if(!n.hit&&!n.miss&&n.l===lane){const d=Math.abs(n.t-now);if(d<best){best=d;target=n;}}});if(!target||best>.25){beep(180,.05,"square",.025);return;}target.hit=true;let text,pts;if(best<=.06){text="PERFECT";pts=1000;counts.PERFECT++}else if(best<=.12){text="GREAT";pts=700;counts.GREAT++}else if(best<=.20){text="GOOD";pts=400;counts.GOOD++}else{text="BAD";pts=100;counts.BAD++}combo++;score+=pts+combo*10;judge(text);beep(text==="PERFECT"?1100:800,.07);}
document.querySelectorAll(".gameLane").forEach(l=>l.addEventListener("pointerdown",e=>{e.preventDefault();tapLane(+l.dataset.lane);}));
function pauseGame(){if(!gameRunning)return;if(!gamePaused){gamePaused=true;cancelAnimationFrame(gameRAF);if(ga.src)ga.pause();else silentPausedAt=gameNow();$("pauseOverlay").classList.add("show");$("pauseBtn").textContent="▶ 再開";}else resumeGame();}
function resumeGame(){if(!gameRunning||!gamePaused)return;if(!ga.src)silentStart=performance.now()/1000-silentPausedAt;gamePaused=false;$("pauseOverlay").classList.remove("show");$("pauseBtn").textContent="⏸ 一時停止";if(ga.src)ga.play().catch(()=>{});gameRAF=requestAnimationFrame(gameLoop);}
function backToTitle(){if(gameRunning&&!confirm("ゲームを終了してタイトルへ戻りますか？"))return;stopGame();show("home");}
$("pauseBtn").onclick=pauseGame;$("resumeBtn").onclick=resumeGame;$("titleBtn").onclick=backToTitle;$("pauseTitleBtn").onclick=backToTitle;
function finishGame(){gameRunning=false;gamePaused=false;cancelAnimationFrame(gameRAF);ga.pause();$("pauseOverlay").classList.remove("show");$("resultScore").textContent="SCORE "+score;$("resultDetail").textContent=`PERFECT ${counts.PERFECT} / GREAT ${counts.GREAT} / GOOD ${counts.GOOD} / BAD ${counts.BAD} / MISS ${counts.MISS}`;show("result");}
function stopGame(){gameRunning=false;gamePaused=false;cancelAnimationFrame(gameRAF);ga.pause();document.querySelectorAll(".gameNote").forEach(x=>x.remove());$("pauseOverlay").classList.remove("show");}
window.addEventListener("resize",()=>{if($("editor").classList.contains("active"))renderEditor();});updateHistoryButtons();renderEditor();
})();
</script>
</body>
</html>
